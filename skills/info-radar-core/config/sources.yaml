# 信息源清单（示例默认值，请替换成你学校的真实源）
# 字段说明：
#   name       信息源显示名
#   url        抓取入口（列表页/公告页）
#   category   条目归类：教务通知 | 竞赛报名 | 讲座活动 | 实习招聘（可扩展）
#   entry_hint 给采集/提炼节点的识别提示：什么样的条目算一条、去哪里找日期和链接
sources:
  - name: 校教务处通知
    url: https://jwc.example.edu.cn/tzgg.htm
    category: 教务通知
    entry_hint: 列表页每条含标题/发布日期/链接；正文落款多为"教务处"，选课/考试/放假类通知优先

  - name: 计算机学院公告
    url: https://cs.example.edu.cn/zsgz.htm
    category: 竞赛报名
    entry_hint: 标题含"竞赛/大赛/选拔/报名"的条目优先，注意报名截止时间通常在正文末尾

  - name: 学校讲座预告
    url: https://www.example.edu.cn/jztg.htm
    category: 讲座活动
    entry_hint: 标题含"讲座/报告/论坛"，正文含举办时间与地点；无报名环节则 deadline 填 null

  - name: 就业信息网
    url: https://career.example.edu.cn/
    category: 实习招聘
    entry_hint: 关注"实习/校招/内推/网申"，网申截止时间是打分关键

# inbox/ 目录下的群通知文字、截图 OCR 结果会作为额外输入源，无需在此登记
